name: Build

on: [ push, pull_request, workflow_dispatch ]

jobs:
  ubuntu:
    name: Ubuntu
    runs-on: ubuntu-latest
    steps:
    - name: Check out
      uses: actions/checkout@v4
    - name: Configure
      run: ./configure
    - name: Build
      run: make
  macos:
    name: macOS
    runs-on: macos-latest
    steps:
    - name: Check out
      uses: actions/checkout@v4
    - name: Configure
      run: ./configure
    - name: Build
      run: make
